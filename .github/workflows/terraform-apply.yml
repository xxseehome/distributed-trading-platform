name: Terraform approved apply

on:
  workflow_dispatch:
    inputs:
      state:
        description: State to apply
        required: true
        type: choice
        options: [foundation, primary, dr]
      plan_run_id:
        description: GitHub Actions run ID that produced the reviewed plan artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: infrastructure-apply
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Download reviewed Terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
          pattern: terraform-plan-${{ inputs.state }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/reviewed-plan
      - name: Locate reviewed plan
        id: reviewed-plan
        shell: bash
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
          plan_path="$(find "$RUNNER_TEMP/reviewed-plan" -type f -name tfplan -print -quit)"
          test -n "$plan_path"
          echo "path=$plan_path" >> "$GITHUB_OUTPUT"
      - name: Exchange GitHub OIDC token for Alibaba STS
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          oidc-provider-arn: ${{ secrets.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ secrets.ALIYUN_APPLY_ROLE_ARN }}
          audience: sts.aliyuncs.com
      - name: Apply only the reviewed plan
        working-directory: terraform/environments/${{ inputs.state }}
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          TF_OSS_ENDPOINT: ${{ secrets.TF_OSS_ENDPOINT }}
        run: |
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_LOCK_TABLE"
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket = "$TF_STATE_BUCKET"
          key = "distributed-trading/${{ inputs.state }}/terraform.tfstate"
          region = "cn-hangzhou"
          prefix = "distributed-trading"
          tablestore_table = "$TF_LOCK_TABLE"
          tablestore_endpoint = "$TF_OSS_ENDPOINT"
          EOF
          terraform init -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform apply -input=false "${{ steps.reviewed-plan.outputs.path }}"
