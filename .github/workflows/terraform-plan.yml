name: Terraform plan

on:
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-shared-infrastructure
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: terraform-plan
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        state: [foundation, primary, dr]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Exchange GitHub OIDC token for Alibaba STS
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          oidc-provider-arn: ${{ secrets.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ secrets.ALIYUN_PLAN_ROLE_ARN }}
          audience: sts.aliyuncs.com
      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: terraform/environments/${{ matrix.state }}
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
          TF_VAR_image_id: ${{ matrix.state == 'dr' && vars.TF_BEIJING_IMAGE_ID || vars.TF_HANGZHOU_IMAGE_ID }}
          TF_VAR_zone_ids: ${{ matrix.state == 'dr' && vars.TF_BEIJING_ZONE_IDS || vars.TF_HANGZHOU_ZONE_IDS }}
        run: |
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_REGION"
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket = "$TF_STATE_BUCKET"
          key = "distributed-trading/${{ matrix.state }}/terraform.tfstate"
          region = "$TF_STATE_REGION"
          encrypt = true
          acl = "private"
          EOF
          terraform init -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Terraform plan only
        working-directory: terraform/environments/${{ matrix.state }}
        env:
          TF_VAR_image_id: ${{ matrix.state == 'dr' && vars.TF_BEIJING_IMAGE_ID || vars.TF_HANGZHOU_IMAGE_ID }}
          TF_VAR_zone_ids: ${{ matrix.state == 'dr' && vars.TF_BEIJING_ZONE_IDS || vars.TF_HANGZHOU_ZONE_IDS }}
        run: terraform plan -out=tfplan -input=false -var='enable_apply=false'
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.state }}-${{ github.sha }}
          path: terraform/environments/${{ matrix.state }}/tfplan
          retention-days: 7
