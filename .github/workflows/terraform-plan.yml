name: Terraform plan

on:
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: infrastructure-plan
    strategy:
      matrix:
        state: [foundation, primary, dr]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Exchange GitHub OIDC token for Alibaba STS
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          oidc-provider-arn: ${{ secrets.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ secrets.ALIYUN_PLAN_ROLE_ARN }}
          audience: sts.aliyuncs.com
      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: terraform/environments/${{ matrix.state }}
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          TF_OSS_ENDPOINT: ${{ secrets.TF_OSS_ENDPOINT }}
        run: |
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_LOCK_TABLE"
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket = "$TF_STATE_BUCKET"
          key = "distributed-trading/${{ matrix.state }}/terraform.tfstate"
          region = "cn-hangzhou"
          prefix = "distributed-trading"
          tablestore_table = "$TF_LOCK_TABLE"
          tablestore_endpoint = "$TF_OSS_ENDPOINT"
          EOF
          terraform init -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Terraform plan only
        working-directory: terraform/environments/${{ matrix.state }}
        run: terraform plan -out=tfplan -input=false -var='enable_apply=false'
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.state }}-${{ github.sha }}
          path: terraform/environments/${{ matrix.state }}/tfplan
          retention-days: 7
