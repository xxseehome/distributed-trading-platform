name: CI and security gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/unit -q

  integration:
    name: Contract and worker integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: pytest tests/integration -q

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  syft:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0.17.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

  opa:
    name: OPA and Conftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow policy
        run: >-
          docker run --rm -v "$PWD:/project" openpolicyagent/conftest:v0.63.0
          test /project/.github/workflows/ci.yml --policy /project/policies/ci
      - name: Render and check Kubernetes policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          for overlay in k8s/overlays/*; do
            kubectl kustomize "$overlay" > "/tmp/rendered/$(basename "$overlay").yaml"
          done
          docker run --rm \
            -v "$PWD:/project" \
            -v /tmp/rendered:/rendered \
            openpolicyagent/conftest:v0.63.0 \
            test --input yaml /rendered --policy /project/policies/kubernetes
      - name: Policy unit tests
        run: >-
          docker run --rm -v "$PWD:/project" openpolicyagent/conftest:v0.63.0
          verify --policy /project/policies

  build:
    name: Build gate
    needs: [quality, integration, gitleaks, trivy, syft, opa]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Trading API image
        run: >-
          docker build --tag
          "$REGISTRY/$IMAGE_OWNER/distributed-trading-api:${GITHUB_SHA}"
          --file backend/Dockerfile .
      - name: Build frontend image
        run: >-
          docker build --tag
          "$REGISTRY/$IMAGE_OWNER/distributed-trading-frontend:${GITHUB_SHA}"
          --file frontend/Dockerfile .
      - name: Scan built API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/distributed-trading-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Push immutable images
        if: github.event_name != 'pull_request'
        run: |
          docker push "$REGISTRY/$IMAGE_OWNER/distributed-trading-api:${GITHUB_SHA}"
          docker push "$REGISTRY/$IMAGE_OWNER/distributed-trading-frontend:${GITHUB_SHA}"
