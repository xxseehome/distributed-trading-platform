name: CI and security gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/unit -q

  integration:
    name: Contract and worker integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: trading
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
    env:
      PYTHONPATH: ${{ github.workspace }}
      CI_SERVICE_TESTS: "1"
      POSTGRES_DSN: postgresql://trading:trading@127.0.0.1:5432/trading
      REDIS_URL: redis://127.0.0.1:6379/0
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply Alembic migrations
        run: alembic -c backend/alembic.ini upgrade head
      - name: Validate PostgreSQL schema
        run: python -m tests.integration.validate_schema
      - run: pytest tests/integration -q

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Kustomize fragments are checked by OPA after rendering; Trivy scans
          # dependencies and repository secrets here.
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  syft:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

  opa:
    name: OPA and Conftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow policy
        run: >-
          docker run --rm -v "$PWD:/project" openpolicyagent/conftest:v0.63.0
          test /project/.github/workflows/ci.yml --policy /project/policies/ci
      - name: Check workflow OIDC policy
        run: >-
          docker run --rm -v "$PWD:/project" openpolicyagent/conftest:v0.63.0
          test /project/.github/workflows --policy /project/policies/workflows
      - name: Render and check Kubernetes policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          for overlay in k8s/overlays/*; do
            kubectl kustomize "$overlay" > "/tmp/rendered/$(basename "$overlay").yaml"
          done
          docker run --rm \
            -v "$PWD:/project" \
            -v /tmp/rendered:/rendered \
            openpolicyagent/conftest:v0.63.0 \
            test --parser yaml /rendered --policy /project/policies/kubernetes
      - name: Policy unit tests
        run: >-
          docker run --rm -v "$PWD:/project" openpolicyagent/conftest:v0.63.0
          verify --policy /project/policies

  terraform:
    name: Terraform validation and plan-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Prepare isolated local-backend validation copy
        shell: bash
        run: |
          set -euo pipefail
          validation_root="$RUNNER_TEMP/terraform-validation"
          cp -R terraform "$validation_root"
          python3 - "$validation_root" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          for path in root.rglob("*.tf"):
              lines = path.read_text().splitlines(keepends=True)
              path.write_text("".join(line for line in lines if line.strip() != 'backend "oss" {}'))
          PY
          echo "TF_VALIDATION_ROOT=$validation_root" >> "$GITHUB_ENV"
      - name: Terraform init and validate
        shell: bash
        run: |
          set -euo pipefail
          for state in foundation primary dr; do
            terraform -chdir="$TF_VALIDATION_ROOT/environments/${state}" init -input=false
            terraform -chdir="$TF_VALIDATION_ROOT/environments/${state}" validate
          done
      - name: Terraform plan-only safety check
        shell: bash
        env:
          # Dummy values are used only to satisfy provider configuration while
          # enable_apply=false and refresh=false guarantee no Alibaba API call.
          ALIBABA_CLOUD_ACCESS_KEY_ID: validation-only
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: validation-only
          ALIBABA_CLOUD_REGION: cn-hangzhou
        run: |
          set -euo pipefail
          terraform -chdir="$TF_VALIDATION_ROOT/environments/foundation" plan \
            -refresh=false -input=false -var='enable_apply=false'
          for state in primary dr; do
            terraform -chdir="$TF_VALIDATION_ROOT/environments/${state}" plan \
              -refresh=false -input=false \
              -var='enable_apply=false' \
              -var='image_id=validation-placeholder' \
              -var='zone_ids=["zone-a","zone-b","zone-c"]'
          done

  build:
    name: Build gate
    needs: [quality, integration, gitleaks, trivy, syft, opa, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Trading API image
        run: >-
          docker build --tag
          "$REGISTRY/$IMAGE_OWNER/distributed-trading-api:${GITHUB_SHA}"
          --file backend/Dockerfile .
      - name: Build frontend image
        run: >-
          docker build --tag
          "$REGISTRY/$IMAGE_OWNER/distributed-trading-frontend:${GITHUB_SHA}"
          --file frontend/Dockerfile .
      - name: Scan built API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/distributed-trading-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Push immutable images
        if: github.event_name != 'pull_request'
        run: |
          docker push "$REGISTRY/$IMAGE_OWNER/distributed-trading-api:${GITHUB_SHA}"
          docker push "$REGISTRY/$IMAGE_OWNER/distributed-trading-frontend:${GITHUB_SHA}"
