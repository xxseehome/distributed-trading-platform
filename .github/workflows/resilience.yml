name: Kubernetes resilience check

on:
  workflow_dispatch:
    inputs:
      expected_image_sha:
        description: Expected 40-character commit SHA
        required: true
        type: string
      staging_base_url:
        description: Staging URL used for the in-band HTTP probe during pod replacement
        required: true
        type: string

permissions:
  contents: read

jobs:
  resilience:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate image SHA input
        env:
          EXPECTED_IMAGE_SHA: ${{ inputs.expected_image_sha }}
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_IMAGE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$STAGING_BASE_URL" =~ ^https?://[^[:space:]]+$ ]]
      - name: Configure approved cluster access
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_B64"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Verify K3s and replica state
        env:
          EXPECTED_IMAGE_SHA: ${{ inputs.expected_image_sha }}
        run: |
          set -euo pipefail
          kubectl get nodes
          kubectl -n staging get deploy,pods -o wide
          for deployment in trading-api trading-worker frontend; do
            kubectl -n staging rollout status "deploy/$deployment" --timeout=5m
            ready_replicas="$(kubectl -n staging get "deploy/$deployment" -o jsonpath='{.status.readyReplicas}')"
            test "$ready_replicas" = "2"
            image="$(kubectl -n staging get "deploy/$deployment" -o jsonpath='{.spec.template.spec.containers[0].image}')"
            grep -F "$EXPECTED_IMAGE_SHA" <<<"$image"
          done
      - name: Select one backend and frontend pod
        id: pods
        run: |
          set -euo pipefail
          backend_pod="$(kubectl -n staging get pods -l app.kubernetes.io/name=trading-api \
            --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')"
          frontend_pod="$(kubectl -n staging get pods -l app.kubernetes.io/name=frontend \
            --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')"
          test -n "$backend_pod"
          test -n "$frontend_pod"
          echo "backend_pod=$backend_pod" >> "$GITHUB_OUTPUT"
          echo "frontend_pod=$frontend_pod" >> "$GITHUB_OUTPUT"
      - name: Delete one backend and frontend pod
        env:
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
          BACKEND_POD: ${{ steps.pods.outputs.backend_pod }}
          FRONTEND_POD: ${{ steps.pods.outputs.frontend_pod }}
        run: |
          set -euo pipefail
          (
            end_time=$((SECONDS + 180))
            while (( SECONDS < end_time )); do
              curl --fail --silent --show-error --max-time 5 "$STAGING_BASE_URL/healthz" >/dev/null || exit 1
              sleep 2
            done
          ) &
          probe_pid=$!
          kubectl -n staging delete pod "$BACKEND_POD" --wait=false --timeout=30s
          kubectl -n staging delete pod "$FRONTEND_POD" --wait=false --timeout=30s
          wait "$probe_pid"
      - name: Confirm recovery
        run: |
          set -euo pipefail
          kubectl -n staging rollout status deploy/trading-api --timeout=5m
          kubectl -n staging rollout status deploy/frontend --timeout=5m
          kubectl -n staging rollout status deploy/trading-worker --timeout=5m
          kubectl -n staging wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=trading-api --timeout=5m
          kubectl -n staging wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=frontend --timeout=5m
          for deployment in trading-api trading-worker frontend; do
            test "$(kubectl -n staging get "deploy/$deployment" -o jsonpath='{.status.readyReplicas}')" = "2"
          done
          kubectl get nodes -o wide
