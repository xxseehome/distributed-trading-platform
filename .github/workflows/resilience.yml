name: Kubernetes resilience check

on:
  workflow_dispatch:
    inputs:
      expected_image_sha:
        description: Expected 40-character commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  resilience:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate image SHA input
        run: echo '${{ inputs.expected_image_sha }}' | grep -Eq '^[0-9a-fA-F]{40}$'
      - name: Verify K3s and replica state
        run: |
          kubectl get nodes
          kubectl -n staging get deploy,pods -o wide
          kubectl -n staging rollout status deploy/trading-api --timeout=5m
          kubectl -n staging rollout status deploy/trading-worker --timeout=5m
          kubectl -n staging rollout status deploy/frontend --timeout=5m
          kubectl -n staging get deploy trading-api trading-worker frontend \
            -o jsonpath='{range .items[*]}{.metadata.name}{"="}{.spec.template.spec.containers[0].image}{"\\n"}{end}' \
            | grep -F "${{ inputs.expected_image_sha }}"
      - name: Delete one backend and frontend pod
        run: |
          kubectl -n staging delete pod -l app.kubernetes.io/name=trading-api --field-selector=status.phase=Running --wait=false --timeout=30s
          kubectl -n staging delete pod -l app.kubernetes.io/name=frontend --field-selector=status.phase=Running --wait=false --timeout=30s
      - name: Confirm recovery
        run: |
          kubectl -n staging rollout status deploy/trading-api --timeout=5m
          kubectl -n staging rollout status deploy/frontend --timeout=5m
          kubectl -n staging wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=trading-api --timeout=5m
          kubectl -n staging wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=frontend --timeout=5m
          kubectl get nodes -o wide
