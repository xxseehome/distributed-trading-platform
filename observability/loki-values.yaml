deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: 250m, memory: 512Mi}
# Keep the chart in true single-binary mode for the local, resource-bounded
# experiment.  The chart defaults for the scalable targets must be explicit.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
lokiCanary:
  enabled: false
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
sidecar:
  rules:
    enabled: false
test:
  enabled: false
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  limits_config:
    retention_period: 6h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
