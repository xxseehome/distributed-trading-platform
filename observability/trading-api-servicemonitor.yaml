apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trading-api
  namespace: observability
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: distributed-trading
spec:
  namespaceSelector:
    matchNames: [production]
  selector:
    matchLabels:
      app.kubernetes.io/name: trading-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
