---
- name: Prepare local trading platform runner
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  vars:
    platform_root: "{{ playbook_dir }}/.."
    runtime_root: "{{ platform_root }}/.runtime"
    tools_root: "{{ platform_root }}/.tools"
  tasks:
    - name: Install pinned local platform tools with checksum verification
      ansible.builtin.command: bash "{{ platform_root }}/scripts/ensure-local-tools.sh"
      changed_when: false

    - name: Verify Docker Desktop is reachable
      ansible.builtin.command: docker info --format '{{ "{{.ServerVersion}}" }}'
      changed_when: false
      register: docker_info
      failed_when: docker_info.rc != 0

    - name: Verify required host architecture
      ansible.builtin.assert:
        that:
          - ansible_system == "Darwin"
          - ansible_architecture in ["arm64", "aarch64", "x86_64"]
        fail_msg: "The local runner must be macOS on Apple Silicon or x86_64."

    - name: Create runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ runtime_root }}"
        - "{{ runtime_root }}/kubeconfigs"
        - "{{ runtime_root }}/backups"
        - "{{ tools_root }}/bin"

    - name: Check kubectl is available
      ansible.builtin.command: kubectl version --client=true --output=yaml
      changed_when: false

    - name: Report local resource contract
      ansible.builtin.debug:
        msg:
          - "Docker Desktop target: 6 CPU, 16 GiB memory, 2 GiB swap, 80 GiB disk"
          - "Kubernetes logical topology: 3 k3d servers plus non-production and DR vClusters"
          - "All local credentials and kubeconfigs stay under .runtime and are ignored"
