apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: trading-applications
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-production
  namespace: argocd
spec:
  project: trading-applications
  source:
    repoURL: https://github.com/xxseehome/distributed-trading-platform.git
    targetRevision: main
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.spec.containers[].image
        - .spec.template.spec.containers[].env[] | select(.name == "COMMIT_SHA" or .name == "IMAGE_DIGEST")
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.template.spec.containers[].image
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-production-dr
  namespace: argocd
spec:
  project: trading-applications
  source:
    repoURL: https://github.com/xxseehome/distributed-trading-platform.git
    targetRevision: main
    path: k8s/overlays/production-dr
  destination:
    server: https://dr.vcluster-dr
    namespace: production-dr
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.spec.containers[].image
        - .spec.template.spec.containers[].env[] | select(.name == "COMMIT_SHA" or .name == "IMAGE_DIGEST")
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.template.spec.containers[].image
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
