apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: bookstore.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    # Local-only fallback: Docker Desktop users can open 127.0.0.1:8080
    # without manually supplying a Host header. The explicit demo hostname
    # above remains the preferred route for scripted checks.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
