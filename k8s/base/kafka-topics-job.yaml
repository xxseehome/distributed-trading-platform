apiVersion: batch/v1
kind: Job
metadata:
  name: trading-kafka-topics
  labels:
    app.kubernetes.io/name: kafka-topics
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
    spec:
      restartPolicy: OnFailure
      serviceAccountName: trading
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: create-topics
          image: dockerproxy.net/apache/kafka:3.9.0
          command: ["bash", "-ec"]
          args:
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 5; done
              if [ "$NAMESPACE" = "nonprod-platform" ]; then
                environments="dev test perf staging"
              else
                environments="$NAMESPACE"
              fi
              for environment in $environments; do
                for topic in orders.accepted.v1 executions.v1 orders.rejected.v1 orders.dlq.v1; do
                  /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
                    --topic "${environment}.${topic}" --partitions 3 --replication-factor "${REPLICATION_FACTOR}"
                done
              done
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REPLICATION_FACTOR
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
