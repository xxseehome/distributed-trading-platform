apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-api
  labels:
    app.kubernetes.io/name: trading-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trading-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trading-api
    spec:
      serviceAccountName: trading
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trading-api
          image: registry.invalid/distributed-trading/trading-api:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_MODE
              value: cluster
            - name: TRADING_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REDIS_SENTINEL_SERVICE
              value: redis-sentinel
            - name: REDIS_MASTER_NAME
              value: mymaster
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_TOPIC_PREFIX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: trading
            - name: POSTGRES_USER
              value: trading
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
                  optional: true
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trading-admin
                  key: token
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: trading-api
  labels:
    app.kubernetes.io/name: trading-api
spec:
  selector:
    app.kubernetes.io/name: trading-api
  ports:
    - name: http
      port: 8000
      targetPort: http

