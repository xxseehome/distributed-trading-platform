apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
data:
  sentinel.conf: |
    port 26379
    sentinel resolve-hostnames yes
    sentinel monitor mymaster redis-0.redis 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 60000
    sentinel parallel-syncs mymaster 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel
  labels:
    app.kubernetes.io/name: redis-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-sentinel
    spec:
      serviceAccountName: trading
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-redis
          image: redis:7.4-alpine
          command: ["sh", "-ec", "until getent hosts redis-0.redis && redis-cli -h redis-0.redis ping; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 999
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
      containers:
        - name: sentinel
          image: redis:7.4-alpine
          command: ["sh", "-ec"]
          args:
            - until getent hosts redis-0.redis && redis-cli -h redis-0.redis ping; do sleep 2; done; cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel
          ports:
            - name: sentinel
              containerPort: 26379
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 999
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: sentinel}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: sentinel}
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: redis-sentinel-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  labels:
    app.kubernetes.io/name: redis-sentinel
spec:
  selector:
    app.kubernetes.io/name: redis-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
