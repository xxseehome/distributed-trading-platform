apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - namespace.yaml
  - ../../base
  - ../../base-data
  - pdb.yaml
labels:
  - pairs:
      platform.example.com/environment: production
replicas:
  - name: trading-api
    count: 3
  - name: trading-worker
    count: 3
  - name: frontend
    count: 3
  - name: redis
    count: 3
  - name: redis-sentinel
    count: 3
  - name: kafka
    count: 3
patches:
  - path: production-workload-patch.yaml
  - path: production-data-patch.yaml
