apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: trading-production
servers: 3
agents: 0
image: rancher/k3s:v1.31.6-k3s1
ports:
  - port: 127.0.0.1:8080:80
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:6550:6443
    nodeFilters:
      - server:0
options:
  k3d:
    wait: true
    timeout: 120s
  k3s:
    extraArgs:
      - arg: --tls-san=127.0.0.1
        nodeFilters:
          - server:*
